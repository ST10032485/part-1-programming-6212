name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore RaceDay.sln

      - name: Build API and Web
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal

      - name: Build Docker image
        run: docker build -t raceday-web ./RaceDay.Web
